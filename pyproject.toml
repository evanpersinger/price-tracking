[project]
name = "price-tracking"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pytesseract",
    "python-dotenv",
    "requests",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
